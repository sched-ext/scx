[package]
name = "scxtui"
version = "2.0.0"
edition = "2024"
rust-version = "1.91"
authors = ["Piotr Gorski <lucjan.lucjanov@gmail.com>"]
license = "GPL-2.0-only"
repository = "https://github.com/sched-ext/scx"
description = "TUI for sched_ext scheduling profiles, through scxcli and scx.service"
readme = "README.md"
keywords = ["sched-ext", "scx", "tui", "scheduler", "linux"]
categories = ["command-line-utilities"]

[package.metadata.scx]
ci.use_clippy = true

[package.metadata.veristat]
disable = true

[dependencies]
anyhow = "1"
ratatui = "0.30"
# `shell_words::join` for the panel: renders a flag vector so that token
# boundaries survive and the line parses back into the same vector.
shell-words = "1"
# Log view: journalctl --output=json parsing + local-time formatting.
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The JSON scxcli prints and the profile file it reads on stdin.
serde = { version = "1", features = ["derive"] }
# Refresh on changes to the profile and environment files instead of a
# timer.
inotify = "0.11"
