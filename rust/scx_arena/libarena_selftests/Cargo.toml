[package]
name = "scx_arena_libarena_selftests"
version = "1.1.4"
edition = "2024"
rust-version = "1.91"

publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libbpf-rs = "=0.27.2"
scx_arena = { path = "../scx_arena", version = "1.1.4" }
scx_utils = { path = "../../scx_utils", version = "1.1.4" }
simplelog = "0.12"

[build-dependencies]
scx_arena = { path = "../scx_arena", version = "1.1.4", features = ["build-support"] }
scx_cargo = { path = "../../scx_cargo", version = "1.1.4" }
