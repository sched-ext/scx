[package]
name = "scx_arena"
version = "1.1.3"
edition = "2024"
rust-version = "1.91"
description = "Crate for setting up the BPF arena library for sched-ext schedulers."
license = "GPL-2.0-only"
include = ["src/**", "bpf/**", "build.rs"]

[dependencies]
anyhow = "1"
libarena-rs = { version = "0.3.0", optional = true, features = ["build-support", "compat"] }
libc = "0.2"
libbpf-rs = "=0.27.1"
libbpf-sys = "=1.7.0"
simplelog = "0.12"
scx_utils = { path = "../../scx_utils", version = "1.1.3" }
tar = { version = "0.4", optional = true }

[features]
build-support = ["dep:libarena-rs", "dep:tar"]

[build-dependencies]
tar = "0.4"
