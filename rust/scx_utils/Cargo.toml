[package]
name = "scx_utils"
version = "1.1.4"
edition = "2024"
rust-version = "1.91"
authors = ["Tejun Heo <tj@kernel.org>"]
license = "GPL-2.0-only"
repository = "https://github.com/sched-ext/scx"
description = "Utilities for sched_ext schedulers"

[dependencies]
anyhow = "1"
bitvec = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
glob = "0.3"
hex = "0.4"
lazy_static = "1"
libbpf-rs = "=0.27.2"
log = "0.4"
nvml-wrapper = { version = "0.12", optional = true }
nvml-wrapper-sys = { version = "0.9", optional = true }
paste = "1"
scx_stats = { path = "../scx_stats", version = "1.1.4" }
serde = { version = "1", features = ["derive"] }
sscanf = "0.5"
zbus = { version = "5", optional = true }
num = "0.4"
tracing = "0.1"
libc = "0.2"
nix = { version = "0.31", features = ["resource"] }

scx_cargo = { path = "../scx_cargo", version = "1.1.4", optional = true }

[build-dependencies]
bindgen = ">=0.69"
ruzstd = "0.8"
scx_cargo = { path = "../scx_cargo", version = "1.1.4" }
tar = "0.4"

[features]
default = []
gpu-topology = ["dep:nvml-wrapper", "dep:nvml-wrapper-sys"]
autopower = ["dep:zbus"]
deprecated-build-support = ["dep:scx_cargo"]
testutils = []

[[example]]
name = "mangolog"
crate-type = ["bin"]

[lints.clippy]
not_unsafe_ptr_arg_deref = "allow"
