[package]
name = "scx_rustsched_loader"
version = "1.1.4"
edition = "2024"
rust-version = "1.91"
description = "Loading and running a Rust BPF sched_ext scheduler: BTF layout, struct_ops, exit record, profiler"
license = "GPL-2.0-only"
authors = ["Andrea Righi <arighi@nvidia.com>"]
repository = "https://github.com/sched-ext/scx"
homepage = "https://github.com/sched-ext/scx"
publish = false

[package.metadata.scx]
ci.use_clippy = true

[dependencies]
scx_rustsched_abi = { path = "../scx_rustsched_abi", version = "1.1.4" }
scx_rustsched_macros = { path = "../scx_rustsched_macros", version = "1.1.4" }
scx_stats = { path = "../scx_stats", version = "1.1.4" }
scx_utils = { path = "../scx_utils", version = "1.1.4" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.27.2"
libc = "0.2"
log = "0.4"
serde = "1"
simplelog = "0.12"
