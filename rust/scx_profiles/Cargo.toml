[package]
name = "scx_profiles"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Piotr Gorski <lucjan.lucjanov@gmail.com>"]
license = "GPL-2.0-only"
repository = "https://github.com/sched-ext/scx"
description = "High-level scheduling profiles for sched_ext, built on scx.service"
readme = "README.md"
keywords = ["sched-ext", "scx", "scheduler", "systemd", "linux"]
categories = ["os::linux-apis"]

[package.metadata.scx]
ci.use_clippy = true

[package.metadata.veristat]
disable = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unique scratch file next to the target for the atomic rewrite.
tempfile = "3"
# Carries a file's POSIX access ACL over the rewrite.
xattr = "1"
