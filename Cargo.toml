[workspace]
members = [
    "rust/scx_arena/scx_arena",
    "rust/scx_arena/selftests",
    "rust/scx_cargo",
    "rust/scx_raw_pmu",
    "rust/scx_rustland_core",
    "rust/scx_stats",
    "rust/scx_stats/scx_stats_derive",
    "rust/scx_userspace_arena",
    "rust/scx_utils",
    "scheds/rust/scx_beerland",
    "scheds/rust/scx_bpfland",
    "scheds/rust/scx_cake",
    "scheds/rust/scx_chaos",
    "scheds/rust/scx_cosmos",
    "scheds/rust/scx_forge",
    "scheds/rust/scx_flash",
    "scheds/rust/scx_lavd",
    "scheds/rust/scx_layered",
    "scheds/rust/scx_mitosis",
    "scheds/rust/scx_p2dq",
    "scheds/rust/scx_pandemonium",
    "scheds/rust/scx_rustland",
    "scheds/rust/scx_rusty",
    "scheds/rust/scx_tickless",
    "scheds/experimental/scx_cidland",
    "scheds/experimental/scx_flow",
    "scheds/experimental/scx_nitosis",
    "scheds/experimental/scx_rlfifo",
    "scheds/experimental/scx_mlfq",
    "tools/scx_characterize",
    "tools/scxtop",
    "tools/scx_forge_agent",
    "tools/vmlinux_docify",
    "tools/xtask",
]
resolver = "3"

[workspace.lints.rustdoc]
bare_urls = "allow"

[workspace.lints.clippy]
arc_with_non_send_sync = "allow"
collapsible_if = "allow"
deref_addrof = "allow"
manual_range_contains = "allow"
needless_range_loop = "allow"
non_canonical_partial_ord_impl = "allow"
not_unsafe_ptr_arg_deref = "allow"
tabs_in_doc_comments = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
write_literal = "allow"


[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = true
lto = false
