[workspace]
members = [
    "rust/scx_arena/scx_arena",
    "rust/scx_arena/libarena_selftests",
    "rust/scx_arena/selftests",
    "rust/scx_rustsched_abi",
    "rust/scx_rustsched_build",
    "rust/scx_rustsched_loader",
    "rust/scx_cargo",
    "rust/scx_raw_pmu",
    "rust/scx_rustland_core",
    "rust/scx_stats",
    "rust/scx_stats/scx_stats_derive",
    "rust/scx_userspace_arena",
    "rust/scx_utils",
    "scheds/rust/scx_beerland",
    "scheds/rust/scx_bpfland",
    "scheds/rust/scx_cake",
    "scheds/rust/scx_chaos",
    "scheds/rust/scx_cosmos",
    "scheds/rust/scx_eevdf",
    "scheds/rust/scx_forge",
    "scheds/rust/scx_flash",
    "scheds/rust/scx_lavd",
    "scheds/rust/scx_layered",
    "scheds/rust/scx_mitosis",
    "scheds/rust/scx_maestro",
    "scheds/rust/scx_p2dq",
    "scheds/rust/scx_pandemonium",
    "scheds/rust/scx_rustland",
    "scheds/rust/scx_rusty",
    "scheds/rust/scx_tickless",
    "scheds/experimental/scx_flow",
    "scheds/experimental/scx_nitosis",
    "scheds/experimental/scx_mavd",
    "scheds/experimental/scx_rlfifo",
    "scheds/experimental/scx_mlfq",
    "scheds/experimental/scx_rburst",
    "scheds/experimental/scx_rlocal",
    "scheds/experimental/scx_rvtime",
    "tools/scx_characterize",
    "tools/scxtop",
    "tools/scxtui",
    "tools/scx_forge_agent",
    "tools/vmlinux_docify",
    "tools/xtask",
]
# The Rust BPF runtime and the BPF side of each scheduler on it are built
# for a BPF target by the scheduler's build script, each a workspace of its
# own.
exclude = ["rust/scx_rustsched", "rust/scx_rustsched_macros", "scheds/experimental/scx_rburst/bpf", "scheds/experimental/scx_rlocal/bpf", "scheds/experimental/scx_rvtime/bpf"]
resolver = "3"

[profile.release]
lto = "thin"

[profile.release-tiny]
inherits = "release"
opt-level = "z"
lto = false
codegen-units = 1
strip = true
panic = "abort"

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 32
panic = "abort"

[profile.ci]
inherits = "dev"
debug = 0
incremental = false
strip = true
lto = false
