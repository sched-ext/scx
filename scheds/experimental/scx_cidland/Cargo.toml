[package]
name = "scx_cidland"
version = "1.1.3"
authors = ["Andrea Righi <arighi@nvidia.com>"]
edition = "2021"
description = "A cid-based, topology-aware sched_ext scheduler, addressing CPUs by their topological CPU ID (cid). https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.27.0"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.3" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.3" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.3" }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.3" }

[features]
enable_backtrace = []

# Verifying this scheduler requires a kernel with cid-form sched_ext support
# (struct sched_ext_ops_cid), which the CI kernels don't provide yet.
[package.metadata.veristat]
disable = true
