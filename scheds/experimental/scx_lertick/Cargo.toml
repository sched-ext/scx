[package]
name = "scx_lertick"
version = "1.1.4"
authors = ["Hungyu Lin <dennylin0707@gmail.com>"]
edition = "2024"
rust-version = "1.91"
description = "A weighted virtual-time sched_ext scheduler that learns time slices, wakeup preemption and queue placement in BPF. https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
libbpf-rs = "=0.27.2"
log = "0.4"
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.4" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.4" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.4" }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.4" }

[features]
enable_backtrace = []
