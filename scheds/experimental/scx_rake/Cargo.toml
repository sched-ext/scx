[package]
name = "scx_rake"
version = "1.1.4"
edition = "2024"
license = "GPL-2.0-only"
description = "scx_cake's sched_ext policy with the BPF program written in Rust on scx_rustsched"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
scx_rustsched_loader = { path = "../../../rust/scx_rustsched_loader", version = "1.1.4" }

[build-dependencies]
scx_rustsched_build = { path = "../../../rust/scx_rustsched_build", version = "1.1.4" }

# CI has no Rust BPF toolchain, and builds scx_rake without its BPF
# objects.
[package.metadata.veristat]
disable = true
