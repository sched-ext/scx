[package]
name = "scx_flow"
version = "4.2.24"
authors = ["Galih Tama <galpt@v.recipes>"]
edition = "2024"
rust-version = "1.91"
description = "A per-CPU ordered queue scheduler for sched_ext."
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
clap = {
    version = "4",
    features = ["derive", "env", "unicode", "wrap_help"],
}
clap_complete = "4"
crossbeam = "0.8"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.27.0"
log = "0.4"
scx_stats = {
    path = "../../../rust/scx_stats",
    version = "1.1.3",
}
scx_stats_derive = {
    path = "../../../rust/scx_stats/scx_stats_derive",
    version = "1.1.3",
}
scx_utils = {
    path = "../../../rust/scx_utils",
    version = "1.1.3",
}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tiny_http = "0.12"

[build-dependencies]
scx_cargo = {
    path = "../../../rust/scx_cargo",
    version = "1.1.3",
}

[features]
enable_backtrace = []
