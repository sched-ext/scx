[package]
name = "scx_intent"
version = "1.0.0"
authors = ["Rahad Bhuiya <rahadbhuiya2021@gmail.com>"]
edition = "2024"
rust-version = "1.91"
description = "A 5-class intent-based preemptive CPU scheduler ported from the Exploidus operating system"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
plain = "0.2"
procfs = "0.18"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.27.1"
libc = "0.2"
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.3" }
scx_rustland_core = { path = "../../../rust/scx_rustland_core", version = "2.4.14" }

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.3" }
scx_rustland_core = { path = "../../../rust/scx_rustland_core", version = "2.4.14" }

[features]
enable_backtrace = []

[package.metadata.veristat]
disable = true

