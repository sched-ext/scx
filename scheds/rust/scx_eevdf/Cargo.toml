[package]
name = "scx_eevdf"
version = "1.1.3"
authors = ["Andrea Righi <arighi@nvidia.com>"]
edition = "2024"
rust-version = "1.91"
description = "A port of the kernel's EEVDF scheduler (fair.c) to sched_ext, addressing CPUs by their topological CPU ID (cid). https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

publish = false

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive", "env", "unicode", "wrap_help"] }
crossbeam = "0.8"
libbpf-rs = "=0.27.1"
libc = "0.2"
log = "0.4"
scx_arena = { path = "../../../rust/scx_arena/scx_arena", version = "1.1.3" }
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.3" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.3" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.3", features = ["autopower"] }
serde = { version = "1", features = ["derive"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.3" }
scx_arena = { path = "../../../rust/scx_arena/scx_arena", version = "1.1.3", features = ["build-support"] }

[features]
enable_backtrace = []

# The checked-in vmlinux.h declares the cpuctl_* members of struct
# sched_ext_ops_cid, which no released kernel provides yet. The loader nulls
# the ones the running kernel lacks, veristat cannot, so it reports the six
# cpuctl_* programs as failures on every kernel the CI covers.
[package.metadata.veristat]
disable = true
